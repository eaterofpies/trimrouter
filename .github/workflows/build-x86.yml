name: Build x86_64 Disk Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to attach image to (e.g. v0.1.0)'
        required: false
        default: ''

jobs:
  build-x86:
    name: Build & Test x86_64 Image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and extract x86_64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg ARCH=x86_64 \
            --build-arg VERGEN_GIT_SHA="${{ github.sha }}" \
            --build-arg VERGEN_GIT_DESCRIBE="${{ github.ref_name }}" \
            --output type=local,dest=./dist \
            .

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: trimrouter-x86_64.img.xz
          path: ./dist/trimrouter-x86_64.img.xz
          if-no-files-found: error
          retention-days: 14

      - name: Attach image to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag != null)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          gh release upload "$TAG" ./dist/trimrouter-x86_64.img.xz --clobber
