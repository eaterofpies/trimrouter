[package]
name = "trimrouter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[test]]
name = "integration_test"
harness = false

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
nix = { version = "0.31.3", features = ["mount", "signal", "process", "reboot", "kmod", "time", "user"] }
libc = "0.2.189"
futures-util = "0.3.34"
evdev = { version = "0.13.2", features = ["tokio", "stream-trait"] }
rtnetlink = "0.23.0"
rustables = "0.8.8"
pnet = { version = "0.35.0", features = ["serde"] }
socket2 = "0.6.5"
dhcproto = "0.15.0"
rand = "0.10.2"
ipnet = "2.12.1"
hickory-proto = "0.26.1"
chrono = { version = "0.4.45", features = ["clock"] }
sntpc = { version = "0.11.0", features = ["std"] }
kobject-uevent = "0.2.0"
netlink-sys = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
postcard = { version = "1.1.3", features = ["use-std"] }
caps = "0.5.6"
clap = { version = "4.6.6", features = ["derive"] }
seccompiler = "0.5.0"
fatfs = "0.3.6"
mbrman = "0.6.1"
log = { version = "0.4.34", features = ["serde"] }

[build-dependencies]
vergen-gitcl = { version = "10.0.3", features = ["build", "cargo"] }





[profile.release]
opt-level = "s"      # Optimize for size
lto = true           # Link-Time Optimization
codegen-units = 1    # Reduce parallel code generation units to optimize size
panic = "abort"      # Abort on panic (reduces binary size, though we can still catch/hook panic)
strip = true         # Strip symbols

[profile.test-fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false

