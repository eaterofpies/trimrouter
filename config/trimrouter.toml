# trimrouter configuration file
# This file is loaded from the boot partition (/boot/config/trimrouter.toml)

[network]
# The MAC addresses used to identify and map the WAN and LAN interfaces
wan_mac = "52:54:00:12:34:56"
lan_mac = "52:54:00:12:34:57"
# dns_servers = ["1.1.1.1", "1.0.0.1"]

[lan]
# Primary and fallback network addressing (gateway derived automatically as .1)
primary_network = "192.168.1.0"
fallback_network = "10.0.0.0"
prefix_length = 24

[system]
# Hardware watchdog supervision (/dev/watchdog) (default: true)
# watchdog = true

# Optional static DHCP reservations
# [dhcp]
# reservations = [
#     { mac = "52:54:00:12:34:58", ip = "192.168.1.50" },
# ]

# Optional inbound port forwarding rules (DNAT)
# [[port_forwarding]]
# proto = "tcp"
# external_port = 8080
# internal_ip = "192.168.1.50"
# internal_port = 80
# description = "Web Server"
